<!DOCTYPE html>
<html>
  <head>
    <title>Adventus3D - Estudo Daniel 2 AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <a-marker preset="hiro">

        <a-text value="BABILONIA\n605 a.C - 539 a.C\nCabeca de Ouro" 
                position="1.5 4.5 0" 
                scale="0.8 0.8 0.8" 
                color="#FFD700" 
                align="left">
        </a-text>

        <a-text value="MEDO-PERSIA\n539 a.C - 331 a.C\nPeito de Prata" 
                position="1.5 3.5 0" 
                scale="0.8 0.8 0.8" 
                color="#C0C0C0" 
                align="left">
        </a-text>

        <a-text value="GRECIA\n331 a.C - 168 a.C\nQuadris de Bronze" 
                position="1.5 2.5 0" 
                scale="0.8 0.8 0.8" 
                color="#CD7F32" 
                align="left">
        </a-text>

        <a-text value="ROMA\n168 a.C - 476 d.C\nPernas de Ferro" 
                position="1.5 1.5 0" 
                scale="0.8 0.8 0.8" 
                color="#A19D94" 
                align="left">
        </a-text>

        <a-text value="ROMA DIVIDIDA\n476 d.C - Tempo do Fim\nPes de Barro e Ferro" 
                position="1.5 0.5 0" 
                scale="0.8 0.8 0.8" 
                color="#8B4513" 
                align="left">
        </a-text>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
