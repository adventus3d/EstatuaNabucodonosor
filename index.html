<!DOCTYPE html>
<html>
  <head>
    <title>Adventus3D - Estudo Daniel 2 AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-marker preset="hiro" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

        <a-entity position="2 0 0" rotation="0 0 0" scale="0.6 0.6 0.6">
          
          <a-plane position="1.8 3.5 -0.1" width="5.5" height="8.5" color="#000000" opacity="0.7"></a-plane>

          <a-text value="Cabeca de Ouro\nBABILONIA\n605 a.C - 539 a.C" 
                  position="0 6.5 0" color="#FFD700" width="5"></a-text>
                  
          <a-text value="Peito de Prata\nMEDO-PERSIA\n539 a.C - 331 a.C" 
                  position="0 5.0 0" color="#C0C0C0" width="5"></a-text>
                  
          <a-text value="Quadris de Bronze\nGRECIA\n331 a.C - 168 a.C" 
                  position="0 3.5 0" color="#CD7F32" width="5"></a-text>
                  
          <a-text value="Pernas de Ferro\nROMA\n168 a.C - 476 d.C" 
                  position="0 2.0 0" color="#A19D94" width="5"></a-text>
                  
          <a-text value="Pes de Barro\nROMA DIVIDIDA\n476 d.C - Tempo do Fim" 
                  position="0 0.5 0" color="#8B4513" width="5"></a-text>
                  
        </a-entity>

      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
